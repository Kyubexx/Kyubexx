<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scentborne</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#ecebf0;--card:#fff;--ink:#17161d;--mute:#6b6a76;--line:#d9d8e0;--acc:#2f3df5;--accink:#fff;--shadow:0 1px 2px rgba(23,22,29,.06),0 8px 24px rgba(23,22,29,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14131a;--card:#1f1e27;--ink:#f1f0f6;--mute:#9a99a8;--line:#33323f;--acc:#7b86ff;--accink:#10101a;--shadow:none}}
:root[data-theme="dark"]{--bg:#14131a;--card:#1f1e27;--ink:#f1f0f6;--mute:#9a99a8;--line:#33323f;--acc:#7b86ff;--accink:#10101a;--shadow:none}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:clip;max-width:100%}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;overflow-x:clip;max-width:100%;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3,.logo{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;margin:0;letter-spacing:-.02em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 62%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 62%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:26px}
.cartbtn{display:flex;gap:8px;align-items:center;background:var(--ink);color:var(--bg);border:0;border-radius:99px;padding:9px 16px;font-weight:600}
.cartbtn b{background:var(--acc);color:var(--accink);border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:13px;padding:0 6px}
.hero{max-width:1100px;margin:0 auto;padding:56px 20px 28px;position:relative}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(60px);opacity:.4;z-index:-1;pointer-events:none}
.hero:before{width:380px;height:380px;right:-60px;top:-30px;background:var(--acc)}
.hero:after{width:300px;height:300px;left:30%;bottom:-120px;background:#ff7ad9;opacity:.28}
main,footer{position:relative}
.hero h1{font-weight:800;font-size:clamp(46px,11vw,112px);line-height:.92}
.hero p{max-width:46ch;color:var(--mute);font-size:18px;margin:20px 0 0}
.deal{display:inline-flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-top:26px;background:color-mix(in srgb,var(--acc) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--accink);padding:14px 22px;border-radius:16px;font-weight:600;box-shadow:0 10px 30px color-mix(in srgb,var(--acc) 35%,transparent)}
.deal strong{font:800 28px "Bricolage Grotesque",sans-serif}
main{max-width:1100px;margin:0 auto;padding:12px 20px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:color-mix(in srgb,var(--card) 72%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid color-mix(in srgb,var(--card) 60%,transparent);border-radius:22px;overflow:hidden;text-align:left;padding:0;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(47,61,245,.18)}
.card img{transition:transform .5s}
.card:hover img{transform:scale(1.04)}
.card{isolation:isolate}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#fff}
.card .t{padding:14px 16px 16px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card h3{font-size:18px;line-height:1.15}
.card small{color:var(--mute);display:block;margin-top:4px}
.price{font-weight:600;white-space:nowrap}
footer{max-width:1100px;margin:0 auto;padding:30px 20px 60px;color:var(--mute);border-top:1px solid var(--line)}
.ov{position:fixed;inset:0;background:rgba(10,10,18,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:40;display:none}
.ov.on{display:block}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(860px,94vw);max-height:90vh;overflow:auto;background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4);border:1px solid color-mix(in srgb,var(--card) 60%,transparent);border-radius:26px;display:grid;grid-template-columns:1fr 1fr}
.modal img{width:100%;height:100%;object-fit:cover;background:#fff;display:block}
.mi{padding:28px;display:flex;flex-direction:column;gap:12px}
.mi h2{font-size:34px;line-height:1}
.mi p{margin:0;color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips span{border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:14px}
.x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);font-size:20px;z-index:2}
.btn{background:var(--acc);color:var(--accink);border:0;border-radius:12px;padding:14px 20px;font-weight:600;font-size:16px;width:100%}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(440px,100vw);background:color-mix(in srgb,var(--card) 78%,transparent);-webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.dh h2{font-size:24px}
.dh button{border:0;background:none;font-size:24px}
.items{flex:1;overflow:auto;padding:8px 20px}
.it{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.it img{width:64px;height:84px;object-fit:cover;border-radius:8px;background:#fff}
.it b{display:block;line-height:1.2}
.qty{display:inline-flex;align-items:center;gap:10px;margin-top:6px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:none}
.rm{border:0;background:none;color:var(--mute);font-size:13px;text-decoration:underline}
.df{padding:16px 20px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between}
.row.tot{font:800 22px "Bricolage Grotesque",sans-serif}
.save{color:var(--acc);font-weight:600}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.empty{color:var(--mute);padding:40px 0;text-align:center}
.toast{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;z-index:60;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.hide{display:none!important}
@media(max-width:640px){.modal{grid-template-columns:1fr;max-height:88dvh}.modal img{height:auto;max-height:42vh;aspect-ratio:auto;object-fit:contain}.mi{padding:20px}.mi h2{font-size:28px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.card h3{font-size:16px}.card .t{flex-direction:column;gap:4px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="logo">scentborne</div><button class="cartbtn" id="openCart" aria-label="Open cart">Cart <b id="count">0</b></button></header>
<section class="hero">
<h1>Twelve bottles.<br>One price.</h1>
<p>Every fragrance is $25. Pick any two and the pair is $40.</p>
<div class="deal"><strong>$25 each</strong><span>Any 2 for $40 &middot; mix and match</span></div>
</section>
<main><div class="grid" id="grid"></div></main>
<footer>Scentborne &middot; Orders are confirmed by text message.</footer>

<div class="ov" id="pov"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="ov" id="cov"><aside class="drawer" role="dialog" aria-modal="true" aria-label="Cart">
<div class="dh"><h2>Your cart</h2><button id="closeCart" aria-label="Close cart">&times;</button></div>
<div class="items" id="items"></div>
<div class="df" id="foot"></div>
</aside></div>
<div class="toast" id="toast"></div>

["Mession De Newyork Rouge Extrait","Eau de Parfum","100 ml","Deep red glass, a gold label and a dark square cap.","Unisex"],
["Ameerat Arabian","Eau de Parfum","100 ml","Matte burgundy bottle with an ornate gold cap and Arabic calligraphy.","Unisex"],
["Blueberry Knight","Eau de Toilette","100 ml","Warm amber glass with the name running up the side.","Men"],
["King","Eau de Parfum","100 ml","A crown-topped bottle in navy and gold.","Men"],
["Blue Sky","Eau de Toilette","110 ml","Frosted glass with a bright blue cap. The largest bottle in the set.","Men"],
["Paris Lights Gold","Eau de Toilette","100 ml","Black-to-clear gradient glass with a copper-gold collar.","Men"],
["Lion Brown","Eau de Parfum","100 ml","Soft brown bottle with a gold lion crest.","Unisex"],
["Azure Vantage","Eau de Parfum","100 ml","Golden liquid under a polished gold collar and cap.","Unisex"],
["Catch","Eau de Parfum","100 ml","Smoked-grey glass with rounded edges and a silver neck.","Men"]
].map((a,i)=>({id:i,name:a[0],type:a[1],size:a[2],desc:a[3],for:a[4],img:"data:image/jpeg;base64,"+IMG[i]}));

let cart={};
try{cart=JSON.parse(localStorage.getItem("sb-cart")||"{}")}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem("sb-cart",JSON.stringify(cart))}catch(e){}};
const n=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const total=c=>Math.floor(c/2)*40+(c%2)*25;
const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),1600)};

$("grid").innerHTML=P.map(p=>`<button class="card" data-id="${p.id}" aria-label="View ${p.name}"><img src="${p.img}" alt="${p.name} bottle and box" loading="lazy"><div class="t"><div><h3>${p.name}</h3><small>${p.type} &middot; ${p.size}</small></div><span class="price">$25</span></div></button>`).join("");
$("grid").onclick=e=>{const c=e.target.closest(".card");if(c)openProduct(+c.dataset.id)};

function openProduct(id){
const p=P[id];
$("modal").innerHTML=`<button class="x" id="mx" aria-label="Close">&times;</button><img src="${p.img}" alt="${p.name}"><div class="mi"><h2>${p.name}</h2><div class="chips"><span>${p.type}</span><span>${p.size}</span><span>${p.for}</span></div><p>${p.desc}</p><div class="row"><b style="font-size:24px">$25</b><span class="save">2 for $40</span></div><button class="btn" id="madd">Add to cart</button><button class="btn alt" id="mbuy">Add and view cart</button></div>`;
$("pov").classList.add("on");
$("mx").onclick=()=>$("pov").classList.remove("on");
$("madd").onclick=()=>{add(id);toast(p.name+" added")};
$("mbuy").onclick=()=>{add(id);$("pov").classList.remove("on");openCart()};
$("mx").focus();
}
$("pov").onclick=e=>{if(e.target.id==="pov")$("pov").classList.remove("on")};
function add(id){cart[id]=(cart[id]||0)+1;save();render()}
function setQ(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save();render()}

function summary(){
const lines=Object.entries(cart).map(([id,q])=>`${q} x ${P[id].name}`);
return lines;
}
function render(){
$("count").textContent=n();
const c=n();
if(!c){$("items").innerHTML='<div class="empty">Your cart is empty. Tap a bottle to add it.</div>';$("foot").innerHTML="";return}
$("items").innerHTML=Object.entries(cart).map(([id,q])=>{const p=P[id];return `<div class="it"><img src="${p.img}" alt=""><div><b>${p.name}</b><span style="color:var(--mute);font-size:14px">${p.type} &middot; ${p.size}</span><div class="qty"><button data-d="-1" data-id="${id}" aria-label="Fewer">&minus;</button><span>${q}</span><button data-d="1" data-id="${id}" aria-label="More">+</button></div></div><div style="text-align:right"><button class="rm" data-d="-99" data-id="${id}">Remove</button></div></div>`}).join("");
const full=c*25,t=total(c),sv=full-t;
$("foot").innerHTML=`<div class="row"><span>Subtotal (${c} item${c>1?"s":""})</span><span>$${full}</span></div>${sv?`<div class="row save"><span>Two-for-$40 savings</span><span>&minus;$${sv}</span></div>`:(c===1?'<div class="save">Add one more bottle and save $10 on the pair.</div>':"")}<div class="row tot"><span>Total</span><span>$${t}</span></div><button class="btn" id="goCheck">Checkout</button>`;
$("goCheck").onclick=checkout;
}
$("items").onclick=e=>{const b=e.target.closest("button[data-id]");if(b)setQ(b.dataset.id,+b.dataset.d)};

function checkout(){
$("foot").innerHTML=`<b>Delivery details</b><input id="fn" placeholder="Your name" autocomplete="name"><input id="fp" placeholder="Your phone number" type="tel" autocomplete="tel"><textarea id="fa" rows="3" placeholder="Delivery address" autocomplete="street-address"></textarea><div class="row tot"><span>Total</span><span>$${total(n())}</span></div><button class="btn" id="send">Send order by text</button><button class="btn alt" id="copy">Copy order</button><button class="btn alt" id="back">Back to cart</button><small style="color:var(--mute)">Sending opens your messaging app with the order ready to go. Press send there to place it.</small>`;
$("back").onclick=render;
const msg=()=>{
const c=n();
return `SCENTBORNE ORDER\n${summary().join("\n")}\nItems: ${c}\nTotal: $${total(c)}\nName: ${$("fn").value||"-"}\nPhone: ${$("fp").value||"-"}\nAddress: ${$("fa").value||"-"}`};
$("send").onclick=()=>{
if(!$("fn").value.trim()){toast("Add your name first");$("fn").focus();return}
location.href="sms:"+PHONE+"?&body="+encodeURIComponent(msg());
};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(msg());toast("Order copied")}catch(e){toast("Copy not available here")}};
}

function openCart(){render();$("cov").classList.add("on")}
$("openCart").onclick=openCart;
$("closeCart").onclick=()=>$("cov").classList.remove("on");
$("cov").onclick=e=>{if(e.target.id==="cov")$("cov").classList.remove("on")};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("pov").classList.remove("on");$("cov").classList.remove("on")}});
render();
</script>
</body>
</html>
